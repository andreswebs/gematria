---
name: Build

defaults:
  run:
    shell: bash

on:
  workflow_call:
    inputs:
      runs-on:
        required: false
        type: string
        default: ubuntu-latest
      artifact-name:
        required: false
        type: string
        default: dist
      artifact-retention-days:
        required: false
        type: number
        default: 7

    outputs:
      artifact-name:
        description: Name of the uploaded build artifact
        value: ${{ jobs.build.outputs.artifact-name }}

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}

    permissions:
      contents: write
      id-token: write
      attestations: write

    outputs:
      artifact-name: ${{ inputs.artifact-name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          args: --help

      - name: Build release artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: make dist VERSION="${VERSION}"

      - name: Smoke-test built artifact
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          tar -xzf "dist/gematria-linux-amd64-${VERSION}.tar.gz" -C /tmp
          out="$(/tmp/gematria-linux-amd64-${VERSION}/gematria --version)"
          echo "${out}"
          [[ "${out}" == "gematria ${VERSION}" ]] || { echo "::error::version mismatch: got '${out}', want 'gematria ${VERSION}'" >&2; exit 1; }

      # cosign-installer v4 installs cosign v3.x, which writes the
      # standardized Sigstore bundle format (.sigstore.json). Consumers need
      # cosign v3+ to verify.
      - name: Install cosign
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # SYFT_SOURCE_* names the SBOM's root package explicitly; without them
      # Syft derives it from the scanned directory path instead of the
      # released software's identity. Scope is governed by the root
      # .syft.yaml (Go source only).
      - name: Generate SBOM
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        env:
          SYFT_SOURCE_NAME: gematria
          SYFT_SOURCE_VERSION: ${{ github.ref_name }}
        with:
          path: .
          format: spdx-json
          output-file: dist/gematria-${{ github.ref_name }}.spdx.json
          upload-artifact: false

      # Keyless-sign the checksums (transitively covers every archive) and the
      # SBOM. Requires id-token: write, already present on this job.
      - name: Sign checksums and SBOM
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          cosign sign-blob --yes \
            --bundle dist/SHA256SUMS.txt.sigstore.json \
            dist/SHA256SUMS.txt
          cosign sign-blob --yes \
            --bundle "dist/gematria-${VERSION}.spdx.json.sigstore.json" \
            "dist/gematria-${VERSION}.spdx.json"

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: dist/
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: error
          overwrite: true
          include-hidden-files: false
